<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none" role="img" aria-label="Logo Mattia Lavarda Osteopata">
  <defs>
    <radialGradient id="dot" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#CDE4F6"/>
      <stop offset="100%" stop-color="#7FB1DC"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B2240" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Stacked ellipses (cairn) -->
  <ellipse cx="288" cy="88"  rx="130" ry="48" fill="#7FB1DC" filter="url(#soft)"/>
  <ellipse cx="296" cy="212" rx="178" ry="60" fill="#2B2E54" filter="url(#soft)"/>
  <ellipse cx="282" cy="392" rx="205" ry="70" fill="#3F6FA0" filter="url(#soft)"/>
  <ellipse cx="296" cy="566" rx="218" ry="78" fill="#2B2E54" filter="url(#soft)"/>

  <!-- Central chain of circles -->
  <circle cx="300" cy="52"  r="6"  fill="url(#dot)"/>
  <circle cx="292" cy="96"  r="11" fill="url(#dot)"/>
  <circle cx="290" cy="142" r="16" fill="url(#dot)"/>
  <circle cx="293" cy="188" r="20" fill="url(#dot)"/>
  <circle cx="289" cy="238" r="24" fill="url(#dot)"/>
  <circle cx="286" cy="300" r="31" fill="url(#dot)"/>
  <circle cx="282" cy="362" r="28" fill="url(#dot)"/>
  <circle cx="278" cy="422" r="22" fill="url(#dot)"/>
  <circle cx="281" cy="482" r="17" fill="url(#dot)"/>
  <circle cx="286" cy="540" r="12" fill="url(#dot)"/>
  <circle cx="292" cy="592" r="8"  fill="url(#dot)"/>
  <circle cx="298" cy="628" r="5"  fill="url(#dot)"/>
</svg>
